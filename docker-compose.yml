services:
  ev-tracker:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    image: ev-tracker:latest
    pull_policy: build
    container_name: ev-tracker
    ports:
      - "8099:8000"
    volumes:
      - ev_tracker_data:/data
    environment:
      # Eigenes Geheimwort setzen – wird für /api/backup benötigt.
      # In Portainer unter "Environment variables" überschreibbar.
      - EV_TRACKER_BACKUP_TOKEN=${EV_TRACKER_BACKUP_TOKEN:-bitte-aendern}
    restart: unless-stopped

volumes:
  ev_tracker_data:
