services:
  ev-tracker:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    image: ev-tracker:latest
    pull_policy: build
    container_name: ev-tracker
    ports:
      - "8099:8000"
    volumes:
      # Fester Pfad auf dem Docker-Host – damit backup.sh direkt an die DB kommt
      - ${EV_TRACKER_DATA_DIR:-/home/smarthome/ev-tracker/data}:/data
    environment:
      - TZ=Europe/Berlin
      # Geheimwort für GET /api/backup (leer = Endpunkt deaktiviert)
      - EV_TRACKER_BACKUP_TOKEN=${EV_TRACKER_BACKUP_TOKEN:-}
    restart: unless-stopped
